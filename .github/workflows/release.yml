name: Release
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # New Version workflow starts it after its push
  workflow_dispatch:
permissions: {}
jobs:
  build:
    name: Build
    outputs:
      new: ${{ steps.version.outputs.new }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check that version is new
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@hplush/tdlib@$VERSION" version > /dev/null 2>&1; then
            echo "$VERSION is already on npm"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Runner has other build tools already
      - name: Install gperf
        if: steps.version.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install --yes gperf
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: node --run build
      - name: Pack
        if: steps.version.outputs.new == 'true'
        run: npm pack
      - name: Save package for staging
        if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          retention-days: 1
          path: hplush-tdlib-*.tgz
  # Separated job, so build tools never see the right to publish
  stage:
    name: Stage
    needs: build
    if: needs.build.outputs.new == 'true'
    permissions:
      contents: read
      # npm takes the proof of the build from GitHub instead of a token
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Maintainer checks the staged package and approves it on npm
      - name: Stage for publish
        run: npm stage publish hplush-tdlib-*.tgz --provenance
